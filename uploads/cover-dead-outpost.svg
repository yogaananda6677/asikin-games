<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="nightSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="55%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <radialGradient id="flashlightBeam" cx="50%" cy="48%" r="55%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#0284c7" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bannerCyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="glow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.65"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#nightSky)"/>
  <circle cx="400" cy="280" r="320" fill="url(#flashlightBeam)"/>

  <!-- Watchtowers & Outpost Compound Silhouette -->
  <g fill="#090d16" stroke="#1e293b" stroke-width="2">
    <rect x="85" y="180" width="55" height="240"/>
    <polygon points="70,180 112,140 155,180"/>
    <rect x="660" y="180" width="55" height="240"/>
    <polygon points="645,180 687,140 730,180"/>
    <rect x="0" y="380" width="800" height="220" fill="#060911"/>
  </g>

  <!-- Watchtower Spotlights -->
  <polygon points="112,165 290,390 190,390" fill="#38bdf8" opacity="0.18"/>
  <polygon points="687,165 610,390 510,390" fill="#ef4444" opacity="0.18"/>

  <!-- Mutant Titan Nemesis Silhouette & Glowing Eyes in Background -->
  <g transform="translate(400, 215)" filter="url(#glow)">
    <rect x="-85" y="-65" width="170" height="165" rx="18" fill="#18181b" stroke="#dc2626" stroke-width="3"/>
    <rect x="-45" y="-115" width="90" height="65" rx="10" fill="#27272a" stroke="#dc2626" stroke-width="3"/>
    <!-- Glowing Red Mutant Eyes -->
    <rect x="-28" y="-92" width="18" height="10" rx="2" fill="#ef4444"/>
    <rect x="10" y="-92" width="18" height="10" rx="2" fill="#ef4444"/>
    <!-- Biohazard Emblem on Chest -->
    <circle cx="0" cy="10" r="32" fill="#450a0a" stroke="#ef4444" stroke-width="3"/>
    <circle cx="0" cy="-6" r="11" fill="none" stroke="#facc15" stroke-width="4"/>
    <circle cx="-13" cy="16" r="11" fill="none" stroke="#facc15" stroke-width="4"/>
    <circle cx="13" cy="16" r="11" fill="none" stroke="#facc15" stroke-width="4"/>
  </g>

  <!-- Tactical Vanguard Soldier & K9 Ghost Silhouettes (Foreground) -->
  <g transform="translate(250, 320)" filter="url(#glow)">
    <!-- Ballistic Shield -->
    <rect x="-45" y="-25" width="68" height="105" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="4"/>
    <rect x="-32" y="-10" width="42" height="20" rx="3" fill="#bae6fd" opacity="0.7"/>
    <!-- Pulse Assault Rifle & Visor -->
    <rect x="35" y="-35" width="46" height="44" rx="8" fill="#1e293b" stroke="#06b6d4" stroke-width="3"/>
    <rect x="44" y="-22" width="32" height="10" rx="2" fill="#38bdf8"/>
    <rect x="55" y="12" width="110" height="16" rx="3" fill="#334155" stroke="#0f172a" stroke-width="2"/>
    <!-- Muzzle Flash -->
    <polygon points="168,20 205,6 192,20 212,26 188,30 200,42" fill="#facc15"/>
  </g>

  <!-- Tactical Radar & Crosshair HUD Accent -->
  <g transform="translate(565, 330)" filter="url(#glow)">
    <circle cx="0" cy="0" r="46" fill="#020617" stroke="#38bdf8" stroke-width="3" opacity="0.9"/>
    <circle cx="0" cy="0" r="24" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4 4"/>
    <circle cx="-12" cy="-14" r="5" fill="#ef4444"/>
    <circle cx="16" cy="-8" r="5" fill="#ef4444"/>
    <circle cx="6" cy="15" r="5" fill="#f59e0b"/>
    <circle cx="0" cy="0" r="4" fill="#38bdf8"/>
  </g>

  <!-- Title Banner -->
  <g transform="translate(400, 505)" filter="url(#glow)">
    <rect x="-295" y="-48" width="590" height="88" rx="22" fill="url(#bannerCyan)" stroke="#38bdf8" stroke-width="4"/>
    <text x="0" y="4" font-family="'Orbitron', 'Chakra Petch', sans-serif" font-size="42" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="3">DEAD OUTPOST</text>
    <text x="0" y="29" font-family="'Share Tech Mono', monospace" font-size="15" font-weight="700" fill="#facc15" text-anchor="middle" letter-spacing="4">3D TACTICAL ZOMBIE FPS • SQUAD &amp; K9</text>
  </g>
</svg>
