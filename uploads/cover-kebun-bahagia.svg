<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="60%" stop-color="#bae6fd"/>
      <stop offset="100%" stop-color="#fef08a"/>
    </linearGradient>
    <linearGradient id="hill1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#84cc16"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>
    <linearGradient id="hill2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#65a30d"/>
      <stop offset="100%" stop-color="#166534"/>
    </linearGradient>
    <linearGradient id="soil" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#854d0e"/>
      <stop offset="100%" stop-color="#451a03"/>
    </linearGradient>
    <linearGradient id="goldBadge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Sky Background -->
  <rect width="800" height="600" fill="url(#sky)"/>

  <!-- Sun -->
  <circle cx="660" cy="110" r="62" fill="#fde047" opacity="0.35"/>
  <circle cx="660" cy="110" r="46" fill="#facc15"/>

  <!-- Fluffy Clouds -->
  <g fill="#ffffff" opacity="0.9">
    <ellipse cx="160" cy="105" rx="55" ry="26"/>
    <ellipse cx="195" cy="95" rx="45" ry="30"/>
    <ellipse cx="125" cy="110" rx="35" ry="20"/>
    <ellipse cx="430" cy="80" rx="48" ry="22"/>
    <ellipse cx="465" cy="75" rx="38" ry="25"/>
  </g>

  <!-- Rolling Green Hills -->
  <path d="M0 320 Q220 230 480 310 T800 280 L800 600 L0 600 Z" fill="url(#hill2)"/>
  <path d="M0 360 Q260 280 540 360 T800 330 L800 600 L0 600 Z" fill="url(#hill1)"/>

  <!-- Red Farm Barn in Background -->
  <g transform="translate(95, 195)" filter="url(#shadow)">
    <polygon points="65,0 0,50 130,50" fill="#991b1b"/>
    <rect x="12" y="50" width="106" height="85" rx="4" fill="#dc2626" stroke="#fee2e2" stroke-width="3"/>
    <rect x="42" y="78" width="46" height="57" fill="#7f1d1d" stroke="#ffffff" stroke-width="3"/>
    <line x1="42" y1="78" x2="88" y2="135" stroke="#ffffff" stroke-width="3"/>
    <line x1="88" y1="78" x2="42" y2="135" stroke="#ffffff" stroke-width="3"/>
    <circle cx="65" cy="32" r="11" fill="#fef08a" stroke="#ffffff" stroke-width="2.5"/>
  </g>

  <!-- Isometric / 2.5D Farm Grid Board -->
  <g transform="translate(210, 225)" filter="url(#shadow)">
    <rect x="0" y="0" width="380" height="230" rx="28" fill="#fef3c7" stroke="#059669" stroke-width="8"/>
    <rect x="16" y="16" width="348" height="198" rx="20" fill="#bbf7d0"/>

    <!-- 4x2 Showcase Farm Plots -->
    <!-- Row 1 -->
    <g transform="translate(28, 26)">
      <rect width="74" height="78" rx="14" fill="url(#soil)" stroke="#230b01" stroke-width="3"/>
      <text x="37" y="52" font-size="40" text-anchor="middle">🌾</text>
    </g>
    <g transform="translate(111, 26)">
      <rect width="74" height="78" rx="14" fill="url(#soil)" stroke="#230b01" stroke-width="3"/>
      <text x="37" y="52" font-size="40" text-anchor="middle">🥕</text>
    </g>
    <g transform="translate(194, 26)">
      <rect width="74" height="78" rx="14" fill="url(#soil)" stroke="#230b01" stroke-width="3"/>
      <text x="37" y="52" font-size="40" text-anchor="middle">🌽</text>
    </g>
    <g transform="translate(277, 26)">
      <rect width="74" height="78" rx="14" fill="url(#soil)" stroke="#230b01" stroke-width="3"/>
      <text x="37" y="52" font-size="40" text-anchor="middle">🍓</text>
    </g>

    <!-- Row 2 -->
    <g transform="translate(28, 114)">
      <rect width="74" height="78" rx="14" fill="url(#soil)" stroke="#230b01" stroke-width="3"/>
      <text x="37" y="52" font-size="38" text-anchor="middle">🌱</text>
    </g>
    <g transform="translate(111, 114)">
      <rect width="74" height="78" rx="14" fill="url(#soil)" stroke="#230b01" stroke-width="3"/>
      <text x="37" y="52" font-size="38" text-anchor="middle">🚿</text>
    </g>
    <g transform="translate(194, 114)">
      <rect width="74" height="78" rx="14" fill="url(#soil)" stroke="#230b01" stroke-width="3"/>
      <text x="37" y="52" font-size="38" text-anchor="middle">✨</text>
    </g>
    <g transform="translate(277, 114)">
      <rect width="74" height="78" rx="14" fill="#65a30d" stroke="#365314" stroke-width="3"/>
      <text x="37" y="52" font-size="38" text-anchor="middle">🪙</text>
    </g>
  </g>

  <!-- Title Banner -->
  <g transform="translate(400, 515)" filter="url(#shadow)">
    <rect x="-255" y="-45" width="510" height="82" rx="26" fill="url(#goldBadge)" stroke="#ffffff" stroke-width="5"/>
    <text x="0" y="7" font-family="'Fredoka', 'Arial Rounded MT Bold', sans-serif" font-size="42" font-weight="900" fill="#451a03" text-anchor="middle" letter-spacing="1.5">KEBUN BAHAGIA</text>
    <text x="0" y="30" font-family="'Fredoka', sans-serif" font-size="15" font-weight="700" fill="#78350f" text-anchor="middle" letter-spacing="3">SIMULATOR BERKEBUN &amp; PANEN RAYA</text>
  </g>
</svg>
