<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400">
  <defs>
    <linearGradient id="boBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070a14"/>
      <stop offset="50%" stop-color="#101830"/>
      <stop offset="100%" stop-color="#1e1136"/>
    </linearGradient>
    <linearGradient id="cyanBlk" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="amberBlk" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="roseBlk" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fb7185"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>
    <linearGradient id="emeraldBlk" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>
  <rect width="640" height="400" fill="url(#boBg)"/>

  <!-- Subtle Matrix Board Frame -->
  <rect x="176" y="56" width="288" height="288" rx="18" fill="#0d1222" stroke="#283458" stroke-width="2"/>

  <!-- Grid Cells -->
  <g transform="translate(192, 72)">
    <!-- Empty Slots -->
    <rect x="0" y="0" width="60" height="60" rx="10" fill="#141c33"/>
    <rect x="65" y="0" width="60" height="60" rx="10" fill="#141c33"/>
    <rect x="130" y="0" width="60" height="60" rx="10" fill="url(#cyanBlk)"/>
    <rect x="195" y="0" width="60" height="60" rx="10" fill="url(#cyanBlk)"/>

    <rect x="0" y="65" width="60" height="60" rx="10" fill="url(#amberBlk)"/>
    <rect x="65" y="65" width="60" height="60" rx="10" fill="url(#amberBlk)"/>
    <rect x="130" y="65" width="60" height="60" rx="10" fill="url(#cyanBlk)"/>
    <rect x="195" y="65" width="60" height="60" rx="10" fill="#141c33"/>

    <!-- Glowing Clearing Row -->
    <rect x="-8" y="128" width="272" height="64" rx="12" fill="#38bdf8" fill-opacity="0.22" stroke="#7dd3fc" stroke-width="1.5"/>
    <rect x="0" y="130" width="60" height="60" rx="10" fill="url(#amberBlk)"/>
    <rect x="65" y="130" width="60" height="60" rx="10" fill="url(#roseBlk)"/>
    <rect x="130" y="130" width="60" height="60" rx="10" fill="url(#emeraldBlk)"/>
    <rect x="195" y="130" width="60" height="60" rx="10" fill="url(#roseBlk)"/>

    <rect x="0" y="195" width="60" height="60" rx="10" fill="#141c33"/>
    <rect x="65" y="195" width="60" height="60" rx="10" fill="url(#roseBlk)"/>
    <rect x="130" y="195" width="60" height="60" rx="10" fill="url(#emeraldBlk)"/>
    <rect x="195" y="195" width="60" height="60" rx="10" fill="url(#emeraldBlk)"/>
  </g>

  <!-- Floating Combo Badge -->
  <g transform="translate(455, 95) rotate(8)">
    <rect x="0" y="0" width="125" height="36" rx="8" fill="#f59e0b" stroke="#fef3c7" stroke-width="2"/>
    <text x="62.5" y="23" fill="#090a0f" font-family="monospace" font-size="14" font-weight="800" text-anchor="middle">COMBO x8</text>
  </g>

  <rect x="28" y="28" width="96" height="24" rx="5" fill="#38bdf8" fill-opacity="0.16" stroke="#38bdf8" stroke-opacity="0.45"/>
  <text x="76" y="44" fill="#7dd3fc" font-family="monospace" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="1.8">PUZZLE</text>
</svg>
