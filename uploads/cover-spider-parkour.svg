<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a6b94"/>
      <stop offset="100%" stop-color="#1e3244"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Sky -->
  <rect width="600" height="450" fill="url(#sky)"/>

  <!-- Distant City Silhouette -->
  <g fill="#162533" opacity="0.6">
    <rect x="30" y="210" width="75" height="240"/>
    <rect x="120" y="170" width="95" height="280"/>
    <rect x="240" y="230" width="80" height="220"/>
    <rect x="350" y="160" width="110" height="290"/>
    <rect x="480" y="195" width="90" height="255"/>
  </g>

  <!-- Ceiling Platform (For Web Swing) -->
  <rect x="160" y="45" width="320" height="32" rx="4" fill="#2d3436"/>
  <rect x="160" y="45" width="320" height="6" fill="#00b894"/>

  <!-- Left & Right Lower Platforms -->
  <rect x="0" y="340" width="190" height="110" fill="#2d3436"/>
  <rect x="0" y="340" width="190" height="6" fill="#00b894"/>

  <rect x="400" y="320" width="200" height="130" fill="#2d3436"/>
  <rect x="400" y="320" width="200" height="6" fill="#00b894"/>

  <!-- Red Spikes in Abyss / Platform Edge -->
  <g fill="#d63031">
    <polygon points="120,340 130,318 140,340"/>
    <polygon points="140,340 150,318 160,340"/>
    <polygon points="160,340 170,318 180,340"/>
    <polygon points="415,320 425,298 435,320"/>
    <polygon points="435,320 445,298 455,320"/>
  </g>

  <!-- Falling Orange Pipe Hazard -->
  <rect x="345" y="115" width="28" height="85" fill="#e17055" stroke="#d35400" stroke-width="2.5"/>
  <line x1="352" y1="88" x2="352" y2="108" stroke="#facc15" stroke-width="2" stroke-dasharray="4 3"/>
  <line x1="366" y1="82" x2="366" y2="108" stroke="#facc15" stroke-width="2" stroke-dasharray="4 3"/>

  <!-- Checkpoint Flag on Right Platform -->
  <line x1="510" y1="320" x2="510" y2="255" stroke="#b2bec3" stroke-width="4"/>
  <polygon points="510,255 546,270 510,285" fill="#00e676" filter="url(#glow)"/>

  <!-- Web Line & Anchor Point -->
  <circle cx="310" cy="77" r="7" fill="#ffffff" filter="url(#glow)"/>
  <circle cx="310" cy="77" r="13" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="3 3"/>
  <line x1="255" y1="200" x2="310" y2="77" stroke="#ffffff" stroke-width="3" filter="url(#glow)"/>

  <!-- Speed Motion Arcs -->
  <path d="M 160 220 Q 210 265 265 225" fill="none" stroke="#74b9ff" stroke-width="2.5" stroke-dasharray="8 6" opacity="0.7"/>
  <path d="M 175 240 Q 220 280 275 245" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-dasharray="6 6" opacity="0.5"/>

  <!-- Dynamic Swinging Stickman -->
  <g transform="translate(245, 210) rotate(-22)">
    <!-- Head -->
    <circle cx="0" cy="-36" r="12" fill="#111" stroke="#fff" stroke-width="2"/>
    <!-- Spider Eyes -->
    <polygon points="-6,-38 -1,-35 -6,-33" fill="#fff"/>
    <polygon points="6,-38 1,-35 6,-33" fill="#fff"/>
    <!-- Torso -->
    <line x1="0" y1="-24" x2="0" y2="8" stroke="#111" stroke-width="6" stroke-linecap="round"/>
    <!-- Arms shooting web -->
    <line x1="0" y1="-16" x2="22" y2="-28" stroke="#111" stroke-width="5" stroke-linecap="round"/>
    <line x1="0" y1="-16" x2="-18" y2="-4" stroke="#111" stroke-width="5" stroke-linecap="round"/>
    <!-- Legs in parkour swing pose -->
    <polyline points="0,8 -16,24 -26,14" fill="none" stroke="#111" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <polyline points="0,8 18,22 10,36" fill="none" stroke="#111" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Title Banner Overlay -->
  <rect x="20" y="366" width="355" height="66" rx="12" fill="#090d16" opacity="0.88" stroke="#00b894" stroke-width="2"/>
  <text x="38" y="396" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="22" letter-spacing="0.5">STICKMAN SPIDER-PARKOUR</text>
  <text x="38" y="418" fill="#00e676" font-family="monospace" font-weight="700" font-size="12" letter-spacing="1.2">WEB SWING • DODGE PIPES • PARKOUR</text>
</svg>
