  <polygon points="320,90 440,140 320,195 200,140" fill="url(#cyan)" fill-opacity="0.75"/>
  <polygon points="200,140 320,195 320,320 200,265" fill="#1d4ed8" fill-opacity="0.65"/>
  <polygon points="440,140 320,195 320,320 440,265" fill="#0284c7" fill-opacity="0.5"/>
