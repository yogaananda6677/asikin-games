  <rect x="28" y="28" width="84" height="24" rx="5" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.18"/>
  <text x="70" y="44" fill="#7dd3fc" font-family="monospace" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="2">LOGIC</text>
