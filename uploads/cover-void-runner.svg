<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400">
  <defs>
    <linearGradient id="bg1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#090a10"/>
      <stop offset="55%" stop-color="#151022"/>
      <stop offset="100%" stop-color="#2e0f25"/>
    </linearGradient>
    <linearGradient id="beam" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0"/>
      <stop offset="100%" stop-color="#f43f5e" stop-opacity="0.45"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.42" r="0.35">
      <stop offset="0%" stop-color="#fb7185"/>
      <stop offset="55%" stop-color="#e11d48"/>
      <stop offset="100%" stop-color="#e11d48" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="640" height="400" fill="url(#bg1)"/>
  <circle cx="320" cy="175" r="115" fill="url(#sun)"/>
  <!-- Perspective Horizon Grid -->
  <g stroke="#f43f5e" stroke-opacity="0.28" stroke-width="1.2">
    <line x1="0" y1="240" x2="640" y2="240"/>
    <line x1="0" y1="262" x2="640" y2="262"/>
    <line x1="0" y1="290" x2="640" y2="290"/>
    <line x1="0" y1="328" x2="640" y2="328"/>
    <line x1="0" y1="375" x2="640" y2="375"/>
    <line x1="320" y1="240" x2="-120" y2="400"/>
    <line x1="320" y1="240" x2="40" y2="400"/>
    <line x1="320" y1="240" x2="180" y2="400"/>
    <line x1="320" y1="240" x2="320" y2="400"/>
    <line x1="320" y1="240" x2="460" y2="400"/>
    <line x1="320" y1="240" x2="600" y2="400"/>
    <line x1="320" y1="240" x2="760" y2="400"/>
  </g>
  <!-- Floating Obstacle Monoliths -->
  <rect x="145" y="135" width="74" height="18" rx="4" fill="#f43f5e"/>
  <rect x="415" y="105" width="88" height="18" rx="4" fill="#fb7185"/>
  <rect x="268" y="78" width="96" height="16" rx="4" fill="#fda4af"/>
  <!-- Player Vector Craft -->
  <polygon points="320,275 292,332 320,318 348,332" fill="#ffffff"/>
  <polygon points="320,318 298,350 342,350" fill="url(#beam)"/>
  <!-- Minimalist Typography Overlay -->
  <rect x="28" y="28" width="84" height="24" rx="5" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.18"/>
  <text x="70" y="44" fill="#ffffff" font-family="monospace" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="2">ACTION</text>
</svg>
