<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#311042"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>
  </defs>
  <rect width="600" height="450" fill="url(#bg)"/>
  <!-- Cyber Grid -->
  <g stroke="#38bdf8" stroke-opacity="0.14" stroke-width="1">
    <line x1="0" y1="320" x2="600" y2="320"/>
    <line x1="0" y1="360" x2="600" y2="360"/>
    <line x1="0" y1="400" x2="600" y2="400"/>
    <line x1="100" y1="300" x2="20" y2="450"/>
    <line x1="200" y1="300" x2="150" y2="450"/>
    <line x1="300" y1="300" x2="300" y2="450"/>
    <line x1="400" y1="300" x2="450" y2="450"/>
    <line x1="500" y1="300" x2="580" y2="450"/>
  </g>
  <!-- Ceiling Swing Bar & Web -->
  <rect x="140" y="42" width="320" height="24" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <circle cx="330" cy="66" r="7" fill="#38bdf8"/>
  <line x1="260" y1="195" x2="330" y2="66" stroke="#e2e8f0" stroke-width="3" stroke-dasharray="6 3"/>
  <!-- Stickman Hero Action Pose -->
  <g transform="translate(250, 200) rotate(-18)">
    <circle cx="0" cy="-34" r="13" fill="#f43f5e" stroke="#fff" stroke-width="2.5"/>
    <line x1="0" y1="-21" x2="0" y2="12" stroke="#fff" stroke-width="6" stroke-linecap="round"/>
    <line x1="0" y1="-14" x2="24" y2="-28" stroke="#38bdf8" stroke-width="5" stroke-linecap="round"/>
    <line x1="0" y1="-14" x2="-20" y2="-2" stroke="#38bdf8" stroke-width="5" stroke-linecap="round"/>
    <polyline points="0,12 -16,28 -26,18" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
    <polyline points="0,12 18,24 12,38" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
  </g>
  <!-- Title Card -->
  <rect x="24" y="346" width="552" height="80" rx="14" fill="#090d16" fill-opacity="0.86" stroke="url(#accent)" stroke-width="2"/>
  <text x="46" y="384" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="24" letter-spacing="0.6">SPIDER-PARKOUR ARENA (Z.AI)</text>
  <text x="46" y="409" fill="#38bdf8" font-family="monospace" font-weight="700" font-size="13" letter-spacing="1.4">RAGDOLL SWING • OBSTACLE COURSE • ARCADE</text>
</svg>
