    <rect x="164" y="82" width="70" height="70" rx="12" fill="url(#litTile)" fill-opacity="0.85"/>

    <rect x="0" y="164" width="70" height="70" rx="12" fill="#181c30" stroke="#2e365a" stroke-width="1.5"/>
    <rect x="82" y="164" width="70" height="70" rx="12" fill="#181c30" stroke="#2e365a" stroke-width="1.5"/>
