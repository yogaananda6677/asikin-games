<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400">
  <defs>
    <linearGradient id="csBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07080d"/>
      <stop offset="50%" stop-color="#111424"/>
      <stop offset="100%" stop-color="#240b18"/>
    </linearGradient>
    <radialGradient id="coreGlow" cx="0.52" cy="0.48" r="0.45">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.42"/>
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="laserBeam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="640" height="400" fill="url(#csBg)"/>
  <rect width="640" height="400" fill="url(#coreGlow)"/>

  <!-- Tactical Radar Grid -->
  <g stroke="#ffffff" stroke-opacity="0.06" stroke-width="1">
    <line x1="0" y1="80" x2="640" y2="80"/>
    <line x1="0" y1="160" x2="640" y2="160"/>
    <line x1="0" y1="240" x2="640" y2="240"/>
    <line x1="0" y1="320" x2="640" y2="320"/>
    <line x1="160" y1="0" x2="160" y2="400"/>
    <line x1="320" y1="0" x2="320" y2="400"/>
    <line x1="480" y1="0" x2="480" y2="400"/>
    <circle cx="320" cy="200" r="135" fill="none" stroke="#f43f5e" stroke-opacity="0.22" stroke-dasharray="6 8"/>
    <circle cx="320" cy="200" r="85" fill="none" stroke="#38bdf8" stroke-opacity="0.25"/>
  </g>

  <!-- Muzzle Flash & Tracer Projectiles -->
  <g transform="translate(220, 225) rotate(-18)">
    <rect x="28" y="-3" width="290" height="6" rx="3" fill="url(#laserBeam)"/>
    <rect x="45" y="-16" width="110" height="3" rx="1.5" fill="#38bdf8" opacity="0.85"/>
    <rect x="75" y="13" width="130" height="3" rx="1.5" fill="#38bdf8" opacity="0.85"/>
    <circle cx="28" cy="0" r="16" fill="#e0f2fe" opacity="0.9"/>
    <circle cx="28" cy="0" r="28" fill="#38bdf8" opacity="0.35"/>
  </g>

  <!-- Player Mech / Cyber Operative Unit -->
  <g transform="translate(220, 225) rotate(-18)">
    <circle cx="0" cy="0" r="26" fill="#0f172a" stroke="#38bdf8" stroke-width="3"/>
    <rect x="10" y="-6" width="26" height="12" rx="3" fill="#e2e8f0"/>
    <circle cx="-2" cy="0" r="10" fill="#38bdf8"/>
  </g>

  <!-- Enemy Swarm Targets & Crosshairs -->
  <g transform="translate(465, 145)">
    <circle cx="0" cy="0" r="34" fill="none" stroke="#f43f5e" stroke-width="1.5" stroke-dasharray="5 5"/>
    <polygon points="0,-24 22,0 0,24 -22,0" fill="#e11d48" stroke="#fda4af" stroke-width="2"/>
    <circle cx="0" cy="0" r="7" fill="#fff1f2"/>
    <!-- Impact Sparks -->
    <line x1="-35" y1="-15" x2="-15" y2="-5" stroke="#fde047" stroke-width="2.5"/>
    <line x1="-28" y1="22" x2="-12" y2="8" stroke="#fb7185" stroke-width="2.5"/>
    <line x1="15" y1="-28" x2="5" y2="-12" stroke="#38bdf8" stroke-width="2.5"/>
  </g>

  <g transform="translate(495, 258)">
    <polygon points="0,-18 17,0 0,18 -17,0" fill="#be123c" stroke="#fb7185" stroke-width="1.8"/>
    <circle cx="0" cy="0" r="5" fill="#fecdd3"/>
  </g>

  <g transform="translate(385, 95)">
    <polygon points="0,-15 14,0 0,15 -14,0" fill="#be123c" stroke="#fb7185" stroke-width="1.5"/>
  </g>

  <!-- HUD Corner Tag -->
  <rect x="28" y="28" width="112" height="24" rx="5" fill="#f43f5e" fill-opacity="0.18" stroke="#f43f5e" stroke-opacity="0.45"/>
  <text x="84" y="44" fill="#fda4af" font-family="monospace" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="1.8">SHOOTER</text>
</svg>
