<header class="topbar">
  <div class="topbar-left">
    <a href="index.html" class="brand" aria-label="ASIKIN GAMES Home">
      <img src="assets/img/logo.png" alt="ASIKIN GAMES" class="brand-logo" />
    </a>
  </div>

  <div class="search-container">
    <span class="search-icon" id="searchIconSlot"></span>
    <input
      type="text"
      id="searchInput"
      class="search-input"
      placeholder="Cari judul game atau kategori..."
      autocomplete="off"
    />
    <kbd class="search-kbd">/</kbd>
  </div>

  <div class="topbar-right">
    <button
      type="button"
      id="themeToggleBtn"
      class="icon-button"
      aria-label="Ganti Mode Tampilan"
      title="Mode Gelap / Terang"
    ></button>
  </div>
</header>
